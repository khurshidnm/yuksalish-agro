# Production stack. Copy infra/env.production.example to .env.production, fill it in, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Only `web` is published, on loopback, for the TLS proxy in front of it (docs/deployment.md).
name: yap-prod

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://yap_app:${YAP_APP_PASSWORD:?}@db:5432/yap
  AI_DATABASE_URL: postgres://yap_ai:${YAP_AI_PASSWORD:?}@db:5432/yap
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?}
  WEB_ORIGIN: ${WEB_ORIGIN:?}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-yap}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  db:
    build: ./infra/postgres
    image: yap/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: yap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: yap
      YAP_APP_PASSWORD: ${YAP_APP_PASSWORD:?}
      YAP_AI_PASSWORD: ${YAP_AI_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
      - ./infra/postgres/init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yap -d yap"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: yap/api:latest
    command: ["tsx", "src/db/migrate.ts"]
    restart: "no"
    environment:
      DATABASE_OWNER_URL: postgres://yap:${POSTGRES_PASSWORD:?}@db:5432/yap
      PLATFORM_ADMIN_PHONE: ${PLATFORM_ADMIN_PHONE:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: yap/api:latest
    restart: unless-stopped
    environment: *api-env
    volumes:
      - files:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: yap/web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  db:
  redis:
  files:
