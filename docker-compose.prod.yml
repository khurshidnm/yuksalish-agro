# Production stack. Start and update it with infra/deploy.sh: see docs/deployment.md.
# Only `web` is published, on loopback, for the TLS proxy in front of it (docker-compose.tls.yml).
#
# Memory: the defaults here suit an 8 GB server. infra/init-env.sh writes values sized for the real
# server into .env.production, and those win. The pilot sizing they follow is in docs/deployment.md.
name: yap-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-env: &api-env
  NODE_ENV: production
  # A memory limit also shrinks Node's default heap to half of it, so it is set here, to about 75 %.
  NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-1536}
  DATABASE_URL: postgres://yap_app:${YAP_APP_PASSWORD:?}@db:5432/yap
  AI_DATABASE_URL: postgres://yap_ai:${YAP_AI_PASSWORD:?}@db:5432/yap
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?}
  WEB_ORIGIN: ${WEB_ORIGIN:?}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-yap}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  LEADS_TELEGRAM_CHAT_ID: ${LEADS_TELEGRAM_CHAT_ID:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_PAID_TIER: ${GEMINI_PAID_TIER:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_THINKING_BUDGET: ${AI_THINKING_BUDGET:-}
  AI_EFFORT: ${AI_EFFORT:-}
  AI_CHAT_PER_MINUTE: ${AI_CHAT_PER_MINUTE:-}
  AI_CHAT_PER_DAY: ${AI_CHAT_PER_DAY:-}
  API_DOCS: ${API_DOCS:-}
  HEARTBEAT_URL: ${HEARTBEAT_URL:-}

services:
  db:
    build: ./infra/postgres
    image: ${YAP_IMAGE_PREFIX:-yap}/postgres:17
    restart: unless-stopped
    # A clean shutdown finishes the checkpoint, so the next start needs no recovery.
    stop_grace_period: 60s
    mem_limit: ${DB_MEM_LIMIT:-3g}
    # Parallel queries share memory through /dev/shm, and Docker's default of 64 MB is too small.
    shm_size: 512m
    logging: *logging
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-768MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2304MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-192MB}
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - wal_compression=lz4
      # The spec's server has SSD storage (21.1).
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # A slow query in the log is the only evidence left after a stall. Its values can be personal data.
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_parameter_max_length=0
    environment:
      POSTGRES_USER: yap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: yap
      # Applies when the data volume is first created: disk corruption is then noticed, not read as data.
      POSTGRES_INITDB_ARGS: --data-checksums
      YAP_APP_PASSWORD: ${YAP_APP_PASSWORD:?}
      YAP_AI_PASSWORD: ${YAP_AI_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
      - ./infra/postgres/init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yap -d yap"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    logging: *logging
    # noeviction: BullMQ's jobs live here, so when memory runs out Redis must refuse new writes rather
    # than silently drop scheduled work. maxmemory stays well under the limit: a rewrite of the
    # append-only file forks the process, and that needs room.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-300mb}
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${YAP_IMAGE_PREFIX:-yap}/api:latest
    command: ["tsx", "src/db/migrate.ts"]
    restart: "no"
    mem_limit: ${API_MEM_LIMIT:-2g}
    logging: *logging
    environment:
      DATABASE_OWNER_URL: postgres://yap:${POSTGRES_PASSWORD:?}@db:5432/yap
      PLATFORM_ADMIN_PHONE: ${PLATFORM_ADMIN_PHONE:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${YAP_IMAGE_PREFIX:-yap}/api:latest
    restart: unless-stopped
    # Stopping waits up to 20 s for Telegram turns in hand (bot.ts), then for jobs and open requests.
    stop_grace_period: 30s
    mem_limit: ${API_MEM_LIMIT:-2g}
    logging: *logging
    environment: *api-env
    volumes:
      - files:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_CONTACT_PHONE: ${VITE_CONTACT_PHONE:-}
        VITE_CONTACT_TELEGRAM: ${VITE_CONTACT_TELEGRAM:-}
    image: ${YAP_IMAGE_PREFIX:-yap}/web:latest
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    logging: *logging
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # A simulated flock for a demo farm: a collar and a bolus on every sheep, posting as a LoRaWAN
  # network server would (docs/tracking.md). Off unless started with infra/simulate.sh start. It invents
  # readings, so never on a farm with real trackers. It stays out of deploys and preflight's memory sum.
  tracking-sim:
    image: ${YAP_IMAGE_PREFIX:-yap}/api:latest
    profiles: ["simulation"]
    command: ["tsx", "src/modules/tracking/simulator/cli.ts", "start"]
    restart: unless-stopped
    mem_limit: ${SIM_MEM_LIMIT:-256m}
    logging: *logging
    environment:
      <<: *api-env
      NODE_OPTIONS: --max-old-space-size=${SIM_HEAP_MB:-192}
      SIM_API_URL: http://api:4000
      SIM_HISTORY_DAYS: ${SIM_HISTORY_DAYS:-7}
    depends_on:
      api:
        condition: service_healthy

volumes:
  db:
  redis:
  files:
