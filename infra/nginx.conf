# Serves the web app and proxies /api to the API, so the browser sees one origin and needs no CORS.
# TLS terminates in front of this container: see docs/deployment.md.

# The query string can hold a searched name or phone, or the token of a file link, and the referrer
# can repeat it. The API keeps both out of its log too (LOG_SERIALIZERS in apps/api/src/app.ts).
log_format no_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

upstream api {
    # A recreated API container can get a new address, and web is not restarted with it, so nginx
    # keeps asking Docker's DNS instead of remembering what it found at start. Needs nginx 1.27.3.
    zone api 1m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:4000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log no_query;

    # The TLS proxy is the only client that may name the real address. Everyone else's
    # X-Forwarded-For is ignored, otherwise login rate limits could be dodged by forging it.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Inherited by both /api locations.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # AI chat streams its answer.
    proxy_buffering off;

    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 120s;
    }

    # One model call is up to 3 attempts of 120 s (modules/ai/provider), and nothing is sent while it
    # runs. Cutting it here would hand a turn that is still working back to the person to send again.
    location /api/v1/ai/ {
        proxy_pass http://api;
        proxy_read_timeout 600s;
    }

    # Must never be cached: a stale service worker would keep serving an old app.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }

    # File names contain a content hash, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    # The public website: finished HTML, written at build time by apps/web/scripts/prerender.mjs.
    # Each address serves one file, and that file redirects a browser with a session to /app.
    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files /landing/uz.html =404;
    }
    location = /ru {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files /landing/ru.html =404;
    }
    location = /en {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files /landing/en.html =404;
    }
    location = /uz-cyrl {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files /landing/uz-cyrl.html =404;
    }
    # One address per page: the same content under a second URL would split its search ranking.
    location /landing/ {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri /index.html;
    }
}
