# Serves the web app and proxies /api to the API, so the browser sees one origin and needs no CORS.
# TLS terminates in front of this container: see docs/deployment.md.
upstream api {
    server api:4000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The TLS proxy is the only client that may name the real address. Everyone else's
    # X-Forwarded-For is ignored, otherwise login rate limits could be dodged by forging it.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        # AI chat streams its answer.
        proxy_buffering off;
    }

    # Must never be cached: a stale service worker would keep serving an old app.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }

    # File names contain a content hash, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri /index.html;
    }
}
