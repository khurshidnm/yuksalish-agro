logLevel: info
# Development only. docker-compose.yml binds every port to 127.0.0.1, and a real camera needs a password.
authInternalUsers:
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: api
api: yes
apiAddress: :9997
rtspAddress: :8554
rtmp: no
srt: no
hlsAddress: :8888
webrtcAddress: :8889
webrtcLocalUDPAddress: ''
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: [127.0.0.1]
webrtcIPsFromInterfaces: no

pathDefaults:
  runOnInitRestart: yes

paths:
  # H.264 without B-frames at 15 fps, which is how a typical IP camera's stream looks.
  barn-1:
    runOnInit: >-
      ffmpeg -re -stream_loop -1 -i /videos/sheep.webm -an
      -vf scale=1280:-2,fps=15 -c:v libx264 -preset veryfast -tune zerolatency
      -profile:v baseline -pix_fmt yuv420p -g 30 -b:v 1500k
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/barn-1
  # The same clip mirrored and zoomed, so the second camera looks like a different view.
  barn-2:
    runOnInit: >-
      ffmpeg -re -stream_loop -1 -i /videos/sheep.webm -an
      -vf hflip,crop=iw*0.7:ih*0.7,scale=1280:-2,fps=15 -c:v libx264 -preset veryfast -tune zerolatency
      -profile:v baseline -pix_fmt yuv420p -g 30 -b:v 1500k
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/barn-2
